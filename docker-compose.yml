services:
  db:
    image: postgres:16-alpine
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./app/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./app/api
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: ./app/web
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173/ > /dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Playwright suite in a container (profile "test": not started by a plain "docker compose up").
  # Run it with npm run test:docker; results land in the host's reports/ folders.
  tests:
    profiles: ["test"]
    build:
      context: .
      dockerfile: tests.Dockerfile
    env_file: .env
    environment:
      WEB_URL: http://web:5173
      API_URL: http://api:3000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      CI: ${CI:-}
    ipc: host
    volumes:
      - ./reports:/work/reports
      - ./playwright-report:/work/playwright-report
      - ./test-results:/work/test-results
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
      web:
        condition: service_healthy

volumes:
  db-data:
